<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Limits of Digital Materiality</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="controls">
    <input type="file" id="fileInput" accept="image/*" />

    <select id="modeSelect">
      <option value="live">Live Machine</option>
      <option value="burn">Real CPU Burn</option>
      <option value="sim_heavy">Sim: Heavy (65-85%)</option>
      <option value="sim_panic">Sim: Panic (85-100%)</option>
      <option value="custom">Sim: Custom %</option>
    </select>

    <label id="customLoadGroup" class="hidden">
      load <input type="range" id="simLoad" min="10" max="100" step="1" value="75" />
      <span id="simLoadVal">75%</span>
    </label>

    <label>gens <input type="range" id="gensSlider" min="6" max="90" step="3" value="24" /> <span id="gensVal">24</span></label>
    <label>int <input type="range" id="intensitySlider" min="0.1" max="1.0" step="0.05" value="0.6" /> <span id="intensityVal">0.60</span></label>
    <label>heal <input type="range" id="healSlider" min="0" max="0.25" step="0.01" value="0.06" /> <span id="healVal">0.06</span></label>
    <label><input type="checkbox" id="scarsCheck" checked /> scars</label>

    <button id="runBtn">grind</button>
    <button id="saveBtn" disabled>save strip</button>
    <button id="toggleViewBtn">archive (<span id="galleryCount">0</span>)</button>

    <span id="vitals">cpu --% ram --%</span>
    <span id="statusBox"></span>
  </div>

  <div id="labView">
    <img id="stripImg" class="strip hidden" alt="" />
  </div>

  <div id="galleryView" class="hidden"></div>

  <script src="/static/main.js"></script>
</body>
</html>
